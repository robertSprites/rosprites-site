<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <meta property="og:site_name" content="Grabify IP Logger &amp; URL Shortener">
  <meta property="og:title" content="Grabify IP Logger &amp; URL Shortener">
  <meta property="og:description" content="Grabify IP Logger &amp; URL Shortener allows you to tracks IP address, track locations and much more. Advanced web analytics at the tap of a finger!">
  <meta property="og:image" content="https://rosprites.com/assets/discord-preview.png">

  <meta property="og:image:width" content="200">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Grabify IP Logger &amp; URL Shortener">
  <meta name="twitter:description" content="Grabify IP Logger &amp; URL Shortener allows you to tracks IP address, track locations and much more. Advanced web analytics at the tap of a finger!">
  <meta name="twitter:image" content="https://rosprites.com/assets/discord-preview.png">
  <meta name="twitter:image:alt" content="Grabify logo">
  <link rel="icon" type="image/png" href="assets/little-plustergeist.png">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; min-height: 100svh; }
    #rain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #ghost {
      position: relative;
      width: clamp(180px, 34vmin, 300px);
      max-width: 80vw;
      aspect-ratio: 1;
      display: block;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #ghost:focus-visible { outline: 2px solid #fff; outline-offset: 8px; border-radius: 12px; }
    #ghost img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  </style>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <button id="ghost" type="button" aria-label="Make it rain little ghosts">
    <img src="assets/little-plustergeist.png" width="420" height="420" alt="Little Plustergeist" draggable="false" fetchpriority="high">
  </button>
  <script>
    (() => {
      const canvas = document.getElementById('rain');
      const context = canvas.getContext('2d');
      const button = document.getElementById('ghost');
      const image = button.querySelector('img');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const ghosts = [];
      let width = 0;
      let height = 0;
      let frame = 0;
      let previousTime = 0;

      if (!context) return;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function draw(time) {
        const seconds = previousTime ? Math.min((time - previousTime) / 1000, 0.05) : 0;
        previousTime = time;
        context.clearRect(0, 0, width, height);

        for (let i = ghosts.length - 1; i >= 0; i--) {
          const ghost = ghosts[i];
          ghost.y += ghost.speed * seconds;
          ghost.angle += ghost.spin * seconds;

          if (ghost.y - ghost.size > height) {
            ghosts.splice(i, 1);
            continue;
          }

          const sway = Math.sin(time * 0.0015 + ghost.phase) * ghost.sway;
          context.save();
          context.translate(ghost.x + sway, ghost.y);
          context.rotate(ghost.angle);
          context.drawImage(image, -ghost.size / 2, -ghost.size / 2, ghost.size, ghost.size);
          context.restore();
        }

        if (ghosts.length) {
          frame = requestAnimationFrame(draw);
        } else {
          context.clearRect(0, 0, width, height);
          frame = 0;
          previousTime = 0;
        }
      }

      button.addEventListener('click', () => {
        if (!image.complete || !image.naturalWidth) return;

        const gentle = reducedMotion.matches;
        const count = gentle ? 10 : 48;

        for (let i = 0; i < count; i++) {
          const size = 28 + Math.random() * 46;
          ghosts.push({
            x: size / 2 + Math.random() * Math.max(0, width - size),
            y: -size - Math.random() * (i < 8 ? 50 : Math.min(height * 0.65, 450)),
            size,
            speed: (gentle ? 380 : 210) + Math.random() * 220,
            angle: (Math.random() - 0.5) * 0.6,
            spin: gentle ? 0 : (Math.random() - 0.5) * 1.8,
            sway: gentle ? 0 : 10 + Math.random() * 16,
            phase: Math.random() * Math.PI * 2
          });
        }

        if (!frame) {
          previousTime = 0;
          frame = requestAnimationFrame(draw);
        }
      });

      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) return;
        cancelAnimationFrame(frame);
        ghosts.length = 0;
        frame = 0;
        previousTime = 0;
        context.clearRect(0, 0, width, height);
      });
      resize();
    })();
  </script>
</body>
</html>
